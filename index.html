<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LavudiyaShivaram - Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: white;
            padding: 60px 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            text-align: center;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #764ba2;
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        
        p {
            margin-bottom: 20px;
            font-size: 1.1em;
            color: #555;
        }
        
        .links {
            margin-top: 40px;
        }
        
        .links a {
            display: inline-block;
            margin: 10px 15px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .links a:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .github-link {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        
        .github-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👋 Welcome!</h1>
        <p class="subtitle">I'm LavudiyaShivaram</p>
        
        <p>This is my personal portfolio and project showcase.</p>
        
        <p>Check out my work, explore my projects, and feel free to get in touch!</p>
        
        <div class="links">
            <a href="https://github.com/LavudiyaShivaram">GitHub Profile</a>
            <a href="https://github.com/LavudiyaShivaram/LavudiyaShivaram.github.io">Repository</a>
        </div>
        
        <p style="margin-top: 40px; font-size: 0.9em; color: #999;">
            © 2026 LavudiyaShivaram. All rights reserved.
        </p>
    </div>
</body>
</html>
